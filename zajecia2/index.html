<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket Chat - Zadanie 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        #chat-section { display: none; }
        #messages { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .log-badge { font-size: 0.8rem; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div id="login-section" class="card shadow-sm p-4">
                <h3 class="text-center mb-4">Logowanie</h3>
                <div class="mb-3">
                    <input type="text" id="username" class="form-control" placeholder="Wpisz swój nick...">
                </div>
                <button onclick="login()" class="btn btn-primary w-100">Zaloguj się</button>
            </div>

            <div id="chat-section" class="card shadow-sm p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3>Chat</h3>
                    <span id="user-display" class="badge bg-secondary"></span>
                </div>

                <div id="messages" class="rounded"></div>

                <div class="input-group">
                    <input type="text" id="message-input" class="form-control" placeholder="Napisz wiadomość...">
                    <button onclick="sendMessage()" class="btn btn-success">Wyślij</button>
                </div>

                <hr>
                <div class="mt-2 text-muted small">
                    <strong>Ostatnia operacja:</strong>
                    <span id="api-status" class="badge bg-info text-dark">Brak aktywności</span>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    let socket;
    let currentUser = '';
    let authToken = '';

    const updateStatus = (method, endpoint) => {
        document.getElementById('api-status').innerText = `${method} ${endpoint}`;
    };

    async function login() {
        const username = document.getElementById('username').value;
        if (!username) return alert("Podaj nick!");

        updateStatus('POST', '/login');
        const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username })
        });

        const data = await response.json();
        if (data.token) {
            authToken = data.token;
            currentUser = data.user;

            document.getElementById('login-section').style.display = 'none';
            document.getElementById('chat-section').style.display = 'block';
            document.getElementById('user-display').innerText = currentUser;

            initChat();
        }
    }

    async function initChat() {
        // 1. Pobierz historię (GET /messages)
        updateStatus('GET', '/messages');
        const response = await fetch('/messages', {
            headers: { 'Authorization': authToken }
        });
        const history = await response.json();
        history.forEach(appendMessage);

        // 2. Połącz z Socket.IO
        socket = io();
        socket.on('chat message', (msg) => {
            appendMessage(msg);
        });
    }

    async function sendMessage() {
        const text = document.getElementById('message-input').value;
        if (!text) return;

        const msgData = { user: currentUser, text: text };

        // 1. Wyślij przez REST API (do archiwizacji)
        updateStatus('POST', '/messages');
        await fetch('/messages', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': authToken
            },
            body: JSON.stringify(msgData)
        });

        // 2. Wyślij przez Socket.IO (do wszystkich)
        socket.emit('chat message', msgData);

        document.getElementById('message-input').value = '';
    }

    function appendMessage(msg) {
        const msgDiv = document.createElement('div');
        msgDiv.innerHTML = `<strong>${msg.user}:</strong> ${msg.text}`;
        msgDiv.className = "mb-1 p-2 bg-white rounded shadow-sm border-start border-primary border-3";
        const container = document.getElementById('messages');
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }
</script>

</body>
</html>
